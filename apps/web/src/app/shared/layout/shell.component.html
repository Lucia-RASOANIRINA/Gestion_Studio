<div class="flex h-screen bg-gs-black text-gs-light overflow-hidden">
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 z-20 bg-black/60 lg:hidden"
      (click)="toggleSidebar()"
    ></div>
  }

  <aside
    class="fixed inset-y-0 left-0 z-30 w-64 flex-shrink-0 bg-gs-dark-gray border-r border-white/5 flex flex-col transition-transform duration-200 ease-in-out lg:static"
    [ngClass]="{ 'max-lg:-translate-x-full': !sidebarOpen() }"
  >
    <div class="px-5 py-6 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <gs-icon name="logo" [size]="22" class="text-gs-blue" />
        <h1 class="font-display text-xl font-semibold text-gs-blue">{{ 'app.title' | translate }}</h1>
      </div>
      <button
        type="button"
        class="text-gs-light/60 hover:text-gs-light lg:hidden"
        (click)="toggleSidebar()"
      >
        <gs-icon name="close" [size]="20" />
      </button>
    </div>
    <nav class="flex-1 px-3 space-y-1 overflow-y-auto">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-gs-navy text-gs-blue"
          class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gs-light/80 hover:bg-gs-navy hover:text-gs-blue transition-colors"
        >
          <gs-icon [name]="item.icon" [size]="18" />
          <span>{{ item.labelKey | translate }}</span>
        </a>
      }
    </nav>
    <div class="p-3 border-t border-white/5 flex items-center justify-between">
      <div class="flex items-center gap-1 text-gs-light/60">
        <gs-icon name="language" [size]="16" />
        <button
          type="button"
          class="text-xs px-2 py-1 rounded hover:bg-gs-navy hover:text-gs-light"
          (click)="useLanguage('fr')"
        >
          FR
        </button>
        <button
          type="button"
          class="text-xs px-2 py-1 rounded hover:bg-gs-navy hover:text-gs-light"
          (click)="useLanguage('en')"
        >
          EN
        </button>
      </div>
      <button
        type="button"
        class="flex items-center gap-1 text-xs px-2 py-1 rounded text-gs-orange hover:bg-gs-navy"
        (click)="logout()"
      >
        <gs-icon name="logout" [size]="14" />
        Logout
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="lg:hidden flex items-center gap-3 px-4 py-3 border-b border-white/5 bg-gs-dark-gray">
      <button type="button" class="text-gs-light/80 hover:text-gs-blue" (click)="toggleSidebar()">
        <gs-icon name="menu" [size]="22" />
      </button>
      <span class="font-display text-lg font-semibold text-gs-blue">{{ 'app.title' | translate }}</span>
    </header>
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
