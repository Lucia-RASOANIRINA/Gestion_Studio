<h2 class="font-display text-2xl font-semibold mb-2">{{ 'nav.dashboard' | translate }}</h2>
<p class="text-gs-light/60 mb-6">Gestion Studio — plateforme de gestion pour maison de production audio.</p>

<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
  @for (stat of stats; track stat.labelKey) {
    <div class="bg-gs-dark-gray border border-white/5 rounded-xl p-5 flex items-center gap-4 hover:border-gs-blue/40 transition-colors">
      <div class="flex items-center justify-center w-11 h-11 rounded-lg bg-gs-navy text-gs-blue flex-shrink-0">
        <gs-icon [name]="stat.icon" [size]="20" />
      </div>
      <div class="min-w-0">
        <p class="text-sm text-gs-light/60 truncate">{{ stat.labelKey | translate }}</p>
        <p class="font-display text-xl font-semibold">{{ stat.value }}</p>
      </div>
    </div>
  }
</div>
