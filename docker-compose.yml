services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion_studio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gestion_studio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gestion_studio}
      POSTGRES_DB: ${DB_NAME:-gestion_studio}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gestion_studio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gestion_studio_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: gestion_studio_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gestion_studio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gestion_studio_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
